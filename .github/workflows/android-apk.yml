name: Android APK demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_PUBLIC_MAP_PROVIDER: osm
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          pnpm run typecheck
          pnpm test
          pnpm run test:server
          pnpm run test:connection
      - name: Generate managed Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compile standalone demo APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --max-workers=2
      - name: Collect APK and checksum
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/tri9i-demo.apk
          cd apk
          sha256sum tri9i-demo.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tri9i-demo-apk
          path: apk/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tri9i-demo-apk
          path: apk
      - name: Publish downloadable test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "demo-$BUILD_NUMBER" apk/tri9i-demo.apk apk/SHA256SUMS.txt \
            --target "$BUILD_SHA" --title "Tri9i — APK de démonstration $BUILD_NUMBER" --latest \
            --notes "APK autonome de test Android ARM, sans Expo Go ni serveur Metro. Carte OpenStreetMap avec Internet. Parcours et alertes simulés à Casablanca, interface et voix en Darija. Aucune donnée de trafic réelle ni clé Mapbox intégrée. Signature de développement générée par le projet Expo : ne pas utiliser comme version de production. Les mises à jour peuvent demander de désinstaller la démo précédente."
