name: Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'demo = simulation; live = GPS réel avec services configurés'
        type: choice
        required: true
        default: demo
        options: [demo, live]
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

env:
  BUILD_MODE: ${{ inputs.mode || 'demo' }}

concurrency:
  group: android-apk-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DEMO_MODE: ${{ inputs.mode == 'live' && 'false' || 'true' }}
      EXPO_PUBLIC_MAP_PROVIDER: osm
      EXPO_PUBLIC_MAPBOX_TOKEN: ${{ inputs.mode == 'live' && secrets.EXPO_PUBLIC_MAPBOX_TOKEN || '' }}
      EXPO_PUBLIC_ALERTS_URL: ${{ inputs.mode == 'live' && vars.EXPO_PUBLIC_ALERTS_URL || '' }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify live service configuration
        if: inputs.mode == 'live'
        run: |
          node --input-type=module <<'JS'
          if (!process.env.EXPO_PUBLIC_MAPBOX_TOKEN?.startsWith('pk.')) throw new Error('Configure the public Mapbox token before a live build.');
          const base = process.env.EXPO_PUBLIC_ALERTS_URL;
          if (!base || new URL(base).protocol !== 'https:') throw new Error('Configure the HTTPS alert server before a live build.');
          const response = await fetch(base.replace(/\/$/, '') + '/health', { signal: AbortSignal.timeout(15000) });
          if (!response.ok || !(await response.json()).ok) throw new Error('Alert server health check failed.');
          JS
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: |
          pnpm run typecheck
          pnpm test
          pnpm run test:server
          pnpm run test:connection
      - name: Generate managed Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compile standalone APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --max-workers=2
      - name: Collect APK and checksum
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/tri9i-$BUILD_MODE.apk"
          cd apk
          sha256sum "tri9i-$BUILD_MODE.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tri9i-apk
          path: apk/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tri9i-apk
          path: apk
      - name: Publish downloadable test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$BUILD_MODE" = live ]; then
            NOTES="GPS réel, recherche et itinéraires Mapbox, alertes du serveur configuré. Waze uniquement si un flux partenaire autorisé est raccordé au serveur. Trafic selon couverture du fournisseur. Favoris locaux : maison, travail, école, sport et lieux personnalisés."
          else
            NOTES="Démonstration simulée à Casablanca avec favoris locaux : maison, travail, école, sport et lieux personnalisés. Pas de trafic réel ni de flux Waze/Google Maps actif. Le mode live attend les accès fournisseur et le serveur HTTPS."
          fi
          gh release create "$BUILD_MODE-$BUILD_NUMBER" "apk/tri9i-$BUILD_MODE.apk" apk/SHA256SUMS.txt \
            --target "$BUILD_SHA" --title "Tri9i — APK $BUILD_MODE $BUILD_NUMBER" --latest \
            --notes "$NOTES APK autonome Android ARM, sans Expo Go ni Metro. Carte OpenStreetMap en ligne. Signature de développement, version de test : une mise à jour peut demander de désinstaller la version précédente, ce qui efface les favoris locaux."
